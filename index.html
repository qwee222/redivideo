<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando...</title>
<style>
       body {
           font-family: Arial, sans-serif;
           background-color: #fff;
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: flex-start;
           min-height: 100vh;
           margin: 0;
           padding-top: 0;
           box-sizing: border-box;
       }
       /* Estilos para el precargador */
       #preload-screen {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background-color: #fff;
           display: flex;
           flex-direction: column;
           justify-content: center;
           align-items: center;
           z-index: 9999;
           text-align: center;
       }
       #preload-screen img {
           width: 120px;
           height: 120px;
           margin-bottom: 20px;
       }
       #preload-screen p {
           font-size: 20px;
           color: #333;
           font-weight: bold;
       }
       /* Estilos de la landing page */
       #landing-page {
           width: 100%;
           display: none;
           flex-direction: column;
           align-items: center;
           justify-content: space-between;
           min-height: 100vh;
           padding-top: 50px;
           box-sizing: border-box;
       }
       .container {
           width: 90%;
           max-width: 400px;
           display: flex;
           flex-direction: column;
           align-items: center;
       }
       .header {
           width: 100%;
           display: flex;
           justify-content: flex-start;
           padding-bottom: 20px;
       }
       .back-arrow {
           font-size: 24px;
           color: #333;
           text-decoration: none;
       }
       .logo {
           margin-bottom: 30px; /* Reducido para hacer espacio para el mensaje de seguridad */
       }
       .logo img {
           width: 60px;
       }
       /* NUEVO ESTILO: Mensaje de seguridad */
       .secure-message {
           display: flex;
           align-items: center;
           color: red;
           font-size: 14px;
           font-style: italic; /* Para el estilo de cursiva */
           margin-bottom: 20px; /* Espacio debajo del mensaje */
           width: 100%;
           text-align: left;
           padding-left: 5%; /* Ajuste para que se alinee con los inputs */
           box-sizing: border-box;
       }
       .secure-message img {
           width: 20px; /* Tamaño del candado */
           height: 20px;
           margin-right: 8px;
           filter: invert(30%) sepia(90%) saturate(700%) hue-rotate(330deg) brightness(80%) contrast(100%); /* Hace que el candado sea rojo */
       }
       /* FIN NUEVO ESTILO */
       .input-group {
           width: 100%;
           margin-bottom: 15px;
       }
       .input-field {
           width: calc(100% - 20px);
           padding: 15px 10px;
           border: 1px solid #ddd;
           border-radius: 8px;
           font-size: 16px;
           box-sizing: border-box;
       }
       .login-button {
           width: 100%;
           padding: 15px;
           background-color: #1877F2;
           color: #fff;
           border: none;
           border-radius: 8px;
           font-size: 17px;
           font-weight: bold;
           cursor: pointer;
           margin-top: 10px;
       }
       .forgot-password {
           margin-top: 20px;
           font-size: 14px;
           color: #000;
           font-weight: bold;
       }
       .separator {
           width: 100%;
           display: flex;
           align-items: center;
           text-align: center;
           margin: 30px 0;
           color: #ccc;
       }
       .separator::before,
       .separator::after {
           content: '';
           flex: 1;
           border-bottom: 1px solid #ccc;
       }
       .separator:not(:empty)::before {
           margin-right: .5em;
       }
       .separator:not(:empty)::after {
           margin-left: .5em;
       }
       .create-account-button {
           width: 70%;
           padding: 15px;
           background-color: #fff;
           color: #1877F2;
           border: 1px solid #1877F2;
           border-radius: 8px;
           font-size: 17px;
           font-weight: bold;
           cursor: pointer;
           margin-top: 50px;
       }
       .meta-logo {
           width: 100%;
           padding-bottom: 20px;
           display: flex;
           justify-content: center;
           align-items: center;
           color: #777;
           font-size: 13px;
       }
</style>
</head>
<body>
<div id="preload-screen">
<img src="https://i.pinimg.com/originals/36/13/47/36134745bc78c10e92e89d1158e3548c.gif" alt="Cargando...">
<p>Espere...</p>
</div>
<div id="landing-page">
<div class="container">
<div class="header">
<a href="#" class="back-arrow">&lt;</a>
</div>
<div class="logo">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Facebook_f_logo_%282019%29.svg/1200px-Facebook_f_logo_%282019%29.svg.png" alt="Facebook Logo">
</div>
<div class="secure-message">
<img src="https://i.imgur.com/r01d864.png" alt="Candado">
<span>Esto es un Sitio Seguro por favor validar siempre antes de ingresar.</span>
</div>
<div class="input-group">
<input type="text" class="input-field" placeholder="Celular o correo electrónico">
</div>
<div class="input-group">
<input type="password" class="input-field" placeholder="Contraseña">
</div>
<button class="login-button" onclick="window.location.href='https://www.google.com'">Iniciar sesión</button>
<p class="forgot-password">¿Olvidaste tu contraseña?</p>
<div class="separator"></div>
<button class="create-account-button">Crear cuenta nueva</button>
</div>
<div class="meta-logo">
&copy; Meta
</div>
</div>
<script>
       // JavaScript para manejar la precarga
       window.addEventListener('load', function() {
           setTimeout(function() {
               document.getElementById('preload-screen').style.display = 'none';
               document.getElementById('landing-page').style.display = 'flex';
           }, 2000);
       });
</script>
</body>
</html>
